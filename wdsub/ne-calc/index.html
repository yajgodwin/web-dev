<!DOCTYPE>
<html>
  <head>
    <title>
      Ne Calc.
    </title>
    <link rel="stylesheet" href="ne-calc-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
  </head>
  <body>
<script src="/web-dev/header-injection.js"></script>
    
    <h1> Nash Equilibrium Calculator</h1>
    
  <div>  <p> This calculator will show you your Nash Equilibrium.</p>
    <p>You will put two numbers in the inputs for strategies and get a grid and by using best response, get your NE.</p></div>
   
   <div id="input-grp"> 
  <label for="p1-strats"> Number of Stratiges for Person 1 </label>
     <input type="number" id="p1-strats" min="1" max ="8">
    <br>
    <br>
     <label for="p2-strats"> Number of Stratiges for Person 2 </label>
    <input type ="number" id="p2-strats" min="1" max="8">
    <br>
    <br>
    <button onclick="enterMatrix()">Go</button>
   
    </div>
    
    <script>
    function enterMatrix(){
     //get input values to pass to next page.
      let p1NumStrats = document.getElementById("p1-strats").value;
      let p2NumStrats = document.getElementById("p2-strats").value;
      
      //send user to matrix page
      navigation.navigate("matrix.html?p1NumStrats=" + p1NumStrats + "&p2NumStrats=" + p2NumStrats);
    }
      
    </script>
    
  </body>
</html>
